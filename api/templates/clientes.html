<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PDV Store Master - Clientes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    width:260px;
    min-height:100vh;
    background:#0d6efd;
    color:#fff;
}

.sidebar h3{
    text-align:center;
    padding:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:#0b5ed7;
}

.content{
    flex:1;
    padding:30px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="d-flex">

<div class="sidebar">

<h3>
<i class="bi bi-server"></i><br>
PDV STORE MASTER
</h3>

<a href="/">
<i class="bi bi-house"></i>
Início
</a>

<a href="/dashboard">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="/clientes">
<i class="bi bi-people"></i>
Clientes
</a>

<a href="/licencas">
<i class="bi bi-key"></i>
Licenças
</a>

</div>

<div class="content">

<h2>Cadastro de Clientes</h2>

<div class="card p-4 mt-4">

<div class="row">

<div class="col-md-6">

<label>Empresa</label>

<input
id="empresa"
class="form-control">

</div>

<div class="col-md-6">

<label>Nome</label>

<input
id="nome"
class="form-control">

</div>

<div class="col-md-6 mt-3">

<label>Telefone</label>

<input
id="telefone"
class="form-control">

</div>

<div class="col-md-6 mt-3">

<label>Endereço</label>

<input
id="endereco"
class="form-control">

</div>

<div class="col-12 mt-4">

<button
class="btn btn-primary"
onclick="cadastrarCliente()">

<i class="bi bi-plus-circle"></i>

Cadastrar Cliente

</button>

</div>

</div>

</div>

<div class="card p-4 mt-4">

<div class="row">

<div class="col-md-6">

<input
id="pesquisa"
class="form-control"
placeholder="Pesquisar cliente..."
onkeyup="filtrarClientes()">

</div>

</div>

<table class="table table-hover mt-4">

<thead class="table-primary">

<tr>

<th>Empresa</th>

<th>Nome</th>

<th>Telefone</th>

<th>Endereço</th>

<th width="170">Ações</th>

</tr>

</thead>

<tbody id="listaClientes">

</tbody>

</table>

</div>

<script>

async function carregarClientes(){

    const resposta = await fetch("/clientes/");

    const clientes = await resposta.json();

    let tabela = document.getElementById("listaClientes");

    tabela.innerHTML = "";

    clientes.forEach(cliente=>{

        tabela.innerHTML += `

        <tr>

            <td>${cliente.empresa}</td>

            <td>${cliente.nome}</td>

            <td>${cliente.telefone ?? ""}</td>

            <td>${cliente.endereco ?? ""}</td>

            <td>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="excluirCliente(${cliente.id})">

                    Excluir

                </button>

            </td>

        </tr>

        `;

    });

}

async function cadastrarCliente(){

    const empresa = document.getElementById("empresa").value;

    const nome = document.getElementById("nome").value;

    const telefone = document.getElementById("telefone").value;

    const endereco = document.getElementById("endereco").value;

    const resposta = await fetch("/clientes/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            empresa,

            nome,

            telefone,

            endereco

        })

    });

    if(!resposta.ok){

        alert("Erro ao cadastrar cliente.");

        return;

    }

    document.getElementById("empresa").value="";

    document.getElementById("nome").value="";

    document.getElementById("telefone").value="";

    document.getElementById("endereco").value="";

    carregarClientes();

}

async function excluirCliente(id){

    if(!confirm("Excluir este cliente?")){

        return;

    }

    await fetch("/clientes/"+id,{

        method:"DELETE"

    });

    carregarClientes();

}

function filtrarClientes(){

    let filtro=document.getElementById("pesquisa").value.toUpperCase();

    let linhas=document.querySelectorAll("#listaClientes tr");

    linhas.forEach(function(linha){

        if(linha.innerText.toUpperCase().indexOf(filtro)>-1){

            linha.style.display="";

        }else{

            linha.style.display="none";

        }

    });

}

carregarClientes();

</script>

</body>

</html>
