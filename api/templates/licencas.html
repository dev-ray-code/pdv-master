<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PDV Store Master - Licenças</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    width:260px;
    min-height:100vh;
    background:#0d6efd;
    color:white;
}

.sidebar h3{
    text-align:center;
    padding:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:#0b5ed7;
}

.content{
    flex:1;
    padding:30px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="d-flex">

<div class="sidebar">

<h3>

<i class="bi bi-server"></i><br>

PDV STORE MASTER

</h3>

<a href="/">
<i class="bi bi-house"></i>
Início
</a>

<a href="/dashboard">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="/clientes">
<i class="bi bi-people"></i>
Clientes
</a>

<a href="/licencas">
<i class="bi bi-key"></i>
Licenças
</a>

</div>

<div class="content">

<h2>Gerenciamento de Licenças</h2>

<div class="row">

<div class="col-md-4">

<div class="card p-3">

<h6>Total</h6>

<h2 id="cardTotal">0</h2>

</div>

</div>

<div class="col-md-4">

<div class="card p-3">

<h6>Ativas</h6>

<h2 id="cardAtivas">0</h2>

</div>

</div>

<div class="col-md-4">

<div class="card p-3">

<h6>Bloqueadas</h6>

<h2 id="cardBloqueadas">0</h2>

</div>

</div>

</div>

<div class="card p-4 mt-4">

<h4>Nova Licença</h4>

<div class="row">

<div class="col-md-6">

<label>Cliente</label>

<select
id="cliente"
class="form-select">

</select>

</div>

<div class="col-md-3">

<label>Plano</label>

<select
id="plano"
class="form-select">

<option value="ANUAL">ANUAL</option>
<option value="MENSAL">MENSAL</option>

</select>

</div>

<div class="col-md-3">

<label>Computadores</label>

<input
id="limite"
type="number"
class="form-control"
value="1">

</div>

<div class="col-md-6 mt-3">

<label>Validade</label>

<input
id="validade"
type="date"
class="form-control">

</div>

<div class="col-md-6 mt-3 d-flex align-items-end">

<button
class="btn btn-primary"
onclick="criarLicenca()">

<i class="bi bi-plus-circle"></i>

Criar Licença

</button>

</div>

</div>

</div>

<div class="card p-4 mt-4">

<div class="row">

<div class="col-md-5">

<input
id="pesquisa"
class="form-control"
placeholder="Pesquisar licença..."
onkeyup="filtrar()">

</div>

</div>

<table class="table table-hover mt-4">

<thead class="table-primary">

<tr>

<th>ID</th>
<th>Cliente</th>
<th>Plano</th>
<th>Status</th>
<th>Validade</th>
<th>PCs</th>
<th width="230">Ações</th>

</tr>

</thead>

<tbody id="listaLicencas">

</tbody>

</table>

</div>

<script>

async function carregarClientes(){

    const resposta = await fetch("/clientes/");

    const clientes = await resposta.json();

    const combo = document.getElementById("cliente");

    combo.innerHTML = "";

    clientes.forEach(cliente=>{

        combo.innerHTML += `
        <option value="${cliente.id}">
            ${cliente.empresa}
        </option>
        `;

    });

}

async function carregarLicencas(){

    const resposta = await fetch("/licencas/");

    const licencas = await resposta.json();

    let tabela = document.getElementById("listaLicencas");

    tabela.innerHTML="";

    let total=0;
    let ativas=0;
    let bloqueadas=0;

    licencas.forEach(item=>{

        total++;

        if(item.status=="ATIVA"){
            ativas++;
        }else{
            bloqueadas++;
        }

        tabela.innerHTML += `

        <tr>

            <td>${item.id}</td>

            <td>${item.cliente_id}</td>

            <td>${item.plano}</td>

            <td>

                <span class="badge bg-${item.status=="ATIVA"?"success":"danger"}">

                    ${item.status}

                </span>

            </td>

            <td>${item.data_vencimento ?? ""}</td>

            <td>${item.limite_computadores}</td>

            <td>

                <button
                class="btn btn-sm btn-secondary"
                onclick="copiar(${item.id})">

                Copiar

                </button>

                <button
                class="btn btn-sm btn-warning"
                onclick="editar(${item.id})">

                Editar

                </button>

                <button
                class="btn btn-sm btn-danger"
                onclick="excluirLicenca(${item.id})">

                Excluir

                </button>

            </td>

        </tr>

        `;

    });

    document.getElementById("cardTotal").innerText=total;
    document.getElementById("cardAtivas").innerText=ativas;
    document.getElementById("cardBloqueadas").innerText=bloqueadas;

}

async function criarLicenca(){

    const cliente_id = document.getElementById("cliente").value;

    const plano = document.getElementById("plano").value;

    const limite_computadores = parseInt(
        document.getElementById("limite").value
    );

    const validade = document.getElementById("validade").value;

    const resposta = await fetch("/licencas/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            cliente_id,
            plano,
            validade,
            limite_computadores

        })

    });

    if(!resposta.ok){

        alert("Erro ao criar licença.");

        return;

    }

    const dados = await resposta.json();

    alert(
`Licença criada com sucesso!

Usuário:
${dados.usuario}

Chave:
${dados.chave}`
    );

    carregarLicencas();

}

async function excluirLicenca(id){

    if(!confirm("Deseja excluir esta licença?")){

        return;

    }

    await fetch("/licencas/"+id,{

        method:"DELETE"

    });

    carregarLicencas();

}

function copiar(id){

    const linha=[...document.querySelectorAll("#listaLicencas tr")]

    .find(l=>l.cells[0].innerText==id);

    if(!linha)return;

    navigator.clipboard.writeText(

        linha.cells[2].innerText

    );

    alert("Chave copiada.");

}

function editar(id){

    alert("A renovação e bloqueio serão implementados no próximo passo.");

}

function filtrar(){

    const filtro = document
        .getElementById("pesquisa")
        .value
        .toUpperCase();

    const linhas = document.querySelectorAll("#listaLicencas tr");

    linhas.forEach(function(linha){

        if(
            linha.innerText.toUpperCase().indexOf(filtro)>-1
        ){
            linha.style.display="";
        }else{
            linha.style.display="none";
        }

    });

}

window.onload = async function(){

    await carregarClientes();

    await carregarLicencas();

};

</script>

</body>

</html>
