<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PDV Store Master - Licenças</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    width:260px;
    min-height:100vh;
    background:#0d6efd;
    color:white;
}

.sidebar h3{
    text-align:center;
    padding:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:#0b5ed7;
}

.content{
    flex:1;
    padding:30px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="d-flex">

<div class="sidebar">

<h3>

<i class="bi bi-server"></i><br>

PDV STORE MASTER

</h3>

<a href="/">
<i class="bi bi-house"></i>
Início
</a>

<a href="/dashboard">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="/clientes">
<i class="bi bi-people"></i>
Clientes
</a>

<a href="/licencas">
<i class="bi bi-key"></i>
Licenças
</a>

</div>

<div class="content">

<h2>Gerenciamento de Licenças</h2>

<!-- ===================================================== -->

<!-- CARDS -->

<!-- ===================================================== -->

<div class="row">

<div class="col-md-4">

<div class="card p-3">

<h6>Total</h6>

<h2 id="cardTotal">0</h2>

</div>

</div>

<div class="col-md-4">

<div class="card p-3">

<h6>Ativas</h6>

<h2 id="cardAtivas">0</h2>

</div>

</div>

<div class="col-md-4">

<div class="card p-3">

<h6>Bloqueadas</h6>

<h2 id="cardBloqueadas">0</h2>

</div>

</div>

</div>

<!-- ===================================================== -->

<!-- NOVA LICENÇA -->

<!-- ===================================================== -->

<div class="card p-4 mt-4">

<h4>Nova Licença</h4>

<div class="row">

<div class="col-md-6">

<label>Cliente</label>

<select
id="cliente"
class="form-select">

</select>

</div>

<div class="col-md-3">

<label>Plano</label>

<select
id="plano"
class="form-select">

<option value="ANUAL">ANUAL</option>
<option value="MENSAL">MENSAL</option>

</select>

</div>

<div class="col-md-3">

<label>Computadores</label>

<input
id="limite"
type="number"
class="form-control"
value="1"
min="1">

</div>

<div class="col-md-6 mt-3">

<label>Validade</label>

<input
id="validade"
type="date"
class="form-control">

</div>

<div class="col-md-6 mt-3 d-flex align-items-end">

<button
class="btn btn-primary"
onclick="criarLicenca()">

<i class="bi bi-plus-circle"></i>

Criar Licença

</button>

</div>

</div>

</div>

<!-- ===================================================== -->

<!-- LISTA -->

<!-- ===================================================== -->

<div class="card p-4 mt-4">

<div class="row">

<div class="col-md-5">

<input
id="pesquisa"
class="form-control"
placeholder="Pesquisar licença..."
onkeyup="filtrar()">

</div>

</div>

<table class="table table-hover mt-4">

<thead class="table-primary">

<tr>

<th>ID</th>
<th>Cliente</th>
<th>Plano</th>
<th>Status</th>
<th>Validade</th>
<th>PCs</th>
<th width="250">Ações</th>

</tr>

</thead>

<tbody id="listaLicencas">

</tbody>

</table>

</div>

</div>

</div>

<!-- ===================================================== -->

<!-- MODAL EDITAR LICENÇA -->

<!-- ===================================================== -->

<div
class="modal fade"
id="modalEditar"
tabindex="-1"
aria-hidden="true">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">

Editar Licença

</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal"> </button>

</div>

<div class="modal-body">

<input
type="hidden"
id="editarId">

<div class="mb-3">

<label class="form-label">
Plano
</label>

<select
id="editarPlano"
class="form-select">

<option value="ANUAL">
ANUAL
</option>

<option value="MENSAL">
MENSAL
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Status
</label>

<select
id="editarStatus"
class="form-select">

<option value="ATIVA">
ATIVA
</option>

<option value="BLOQUEADA">
BLOQUEADA
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Validade
</label>

<input
id="editarValidade"
type="date"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">
Limite de computadores
</label>

<input
id="editarLimite"
type="number"
min="1"
class="form-control">

</div>

</div>

<div class="modal-footer">

<button
type="button"
class="btn btn-secondary"
data-bs-dismiss="modal">

Cancelar

</button>

<button
type="button"
class="btn btn-primary"
onclick="salvarEdicao()">

Salvar alterações

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>


// ========================================================
// CLIENTES
// ========================================================

async function carregarClientes(){

    try{

        const resposta =
            await fetch("/clientes/");


        if(!resposta.ok){

            throw new Error(
                "Erro ao carregar clientes"
            );

        }


        const clientes =
            await resposta.json();


        const combo =
            document.getElementById("cliente");


        combo.innerHTML="";


        clientes.forEach(cliente=>{

            combo.innerHTML += `

                <option value="${cliente.id}">

                    ${cliente.empresa}

                </option>

            `;

        });

    }
    catch(erro){

        console.error(erro);

        alert(
            "Erro ao carregar clientes."
        );

    }

}



// ========================================================
// LICENÇAS
// ========================================================

async function carregarLicencas(){

    try{

        const resposta =
            await fetch("/licencas/");


        if(!resposta.ok){

            throw new Error(
                "Erro ao carregar licenças"
            );

        }


        const licencas =
            await resposta.json();


        const tabela =
            document.getElementById(
                "listaLicencas"
            );


        tabela.innerHTML="";


        let total=0;

        let ativas=0;

        let bloqueadas=0;


        licencas.forEach(item=>{

            total++;


            if(item.status=="ATIVA"){

                ativas++;

            }
            else{

                bloqueadas++;

            }


            const validade =
                item.validade
                ? item.validade
                : "";


            tabela.innerHTML += `

            <tr>

                <td>
                    ${item.id}
                </td>


                <td>
                    ${item.empresa ?? item.cliente_id}
                </td>


                <td>
                    ${item.plano}
                </td>


                <td>

                    <span
                    class="badge bg-${
                        item.status=="ATIVA"
                        ? "success"
                        : "danger"
                    }">

                        ${item.status}

                    </span>

                </td>


                <td>
                    ${validade}
                </td>


                <td>
                    ${item.limite_computadores}
                </td>


                <td>


                    <button
                    class="btn btn-sm btn-secondary"
                    onclick="copiar('${item.chave}')">

                    <i class="bi bi-copy"></i>

                    Copiar

                    </button>


                    <button
                    class="btn btn-sm btn-warning"
                    onclick="editar(${item.id})">

                    <i class="bi bi-pencil"></i>

                    Editar

                    </button>


                    <button
                    class="btn btn-sm btn-danger"
                    onclick="excluirLicenca(${item.id})">

                    <i class="bi bi-trash"></i>

                    Excluir

                    </button>


                </td>

            </tr>

            `;

        });


        document.getElementById(
            "cardTotal"
        ).innerText=total;


        document.getElementById(
            "cardAtivas"
        ).innerText=ativas;


        document.getElementById(
            "cardBloqueadas"
        ).innerText=bloqueadas;


    }
    catch(erro){

        console.error(erro);

        alert(
            "Erro ao carregar licenças."
        );

    }

}



// ========================================================
// CRIAR LICENÇA
// ========================================================

async function criarLicenca(){

    const clienteValor =
        document.getElementById(
            "cliente"
        ).value;


    const plano =
        document.getElementById(
            "plano"
        ).value;


    const limiteValor =
        document.getElementById(
            "limite"
        ).value;


    const validadeValor =
        document.getElementById(
            "validade"
        ).value;


    if(!clienteValor){

        alert(
            "Selecione um cliente."
        );

        return;

    }


    const cliente_id =
        parseInt(
            clienteValor,
            10
        );


    const limite_computadores =
        parseInt(
            limiteValor,
            10
        );


    if(!Number.isInteger(cliente_id)){

        alert(
            "Cliente inválido."
        );

        return;

    }


    if(
        !Number.isInteger(
            limite_computadores
        )
        ||
        limite_computadores < 1
    ){

        alert(
            "Informe uma quantidade válida de computadores."
        );

        return;

    }


    const validade =
        validadeValor
        ? validadeValor
        : null;


    try{

        const resposta =
            await fetch(
                "/licencas/",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        cliente_id:
                            cliente_id,

                        plano:
                            plano,

                        validade:
                            validade,

                        limite_computadores:
                            limite_computadores

                    })

                }
            );


        const dados =
            await resposta.json();


        if(!resposta.ok){

            console.error(
                "Erro:",
                dados
            );


            alert(
                dados.detail ||
                "Erro ao criar licença."
            );

            return;

        }


        alert(
`Licença criada com sucesso!

Usuário:
${dados.usuario}

Chave:
${dados.chave}

Plano:
${dados.plano}

Validade:
${dados.validade ?? "Sem validade definida"}`
        );


        document.getElementById(
            "validade"
        ).value="";


        document.getElementById(
            "limite"
        ).value="1";


        await carregarLicencas();


    }
    catch(erro){

        console.error(erro);

        alert(
            "Não foi possível conectar ao servidor."
        );

    }

}



// ========================================================
// EDITAR
// ========================================================

async function editar(id){

    try{

        const resposta =
            await fetch(
                "/licencas/"+id
            );


        if(!resposta.ok){

            throw new Error(
                "Licença não encontrada."
            );

        }


        const licenca =
            await resposta.json();


        document.getElementById(
            "editarId"
        ).value=licenca.id;


        document.getElementById(
            "editarPlano"
        ).value=licenca.plano;


        document.getElementById(
            "editarStatus"
        ).value=licenca.status;


        document.getElementById(
            "editarValidade"
        ).value=
            licenca.validade
            ? licenca.validade
            : "";


        document.getElementById(
            "editarLimite"
        ).value=
            licenca.limite_computadores;


        const modal =
            new bootstrap.Modal(
                document.getElementById(
                    "modalEditar"
                )
            );


        modal.show();


    }
    catch(erro){

        console.error(erro);

        alert(
            "Erro ao carregar licença."
        );

    }

}



// ========================================================
// SALVAR EDIÇÃO
// ========================================================

async function salvarEdicao(){

    const id =
        document.getElementById(
            "editarId"
        ).value;


    const plano =
        document.getElementById(
            "editarPlano"
        ).value;


    const status =
        document.getElementById(
            "editarStatus"
        ).value;


    const validadeValor =
        document.getElementById(
            "editarValidade"
        ).value;


    const limite =
        parseInt(
            document.getElementById(
                "editarLimite"
            ).value,
            10
        );


    if(!id){

        alert(
            "Licença inválida."
        );

        return;

    }


    if(
        !Number.isInteger(limite)
        ||
        limite < 1
    ){

        alert(
            "Informe um limite válido."
        );

        return;

    }


    const validade =
        validadeValor
        ? validadeValor
        : null;


    try{

        const resposta =
            await fetch(
                "/licencas/"+id,
                {

                    method:"PUT",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:JSON.stringify({

                        plano:
                            plano,

                        status:
                            status,

                        validade:
                            validade,

                        limite_computadores:
                            limite

                    })

                }
            );


        const dados =
            await resposta.json();


        if(!resposta.ok){

            console.error(
                "Erro ao editar:",
                dados
            );


            alert(
                dados.detail ||
                "Erro ao salvar alterações."
            );

            return;

        }


        alert(
            "Licença atualizada com sucesso!"
        );


        const modalElement =
            document.getElementById(
                "modalEditar"
            );


        const modal =
            bootstrap.Modal.getInstance(
                modalElement
            );


        if(modal){

            modal.hide();

        }


        await carregarLicencas();


    }
    catch(erro){

        console.error(erro);

        alert(
            "Não foi possível conectar ao servidor."
        );

    }

}



// ========================================================
// EXCLUIR
// ========================================================

async function excluirLicenca(id){

    if(
        !confirm(
            "Deseja excluir esta licença?"
        )
    ){

        return;

    }


    try{

        const resposta =
            await fetch(
                "/licencas/"+id,
                {
                    method:"DELETE"
                }
            );


        if(!resposta.ok){

            const dados =
                await resposta.json();


            alert(
                dados.detail ||
                "Erro ao excluir licença."
            );

            return;

        }


        await carregarLicencas();


    }
    catch(erro){

        console.error(erro);

        alert(
            "Erro ao excluir licença."
        );

    }

}



// ========================================================
// COPIAR CHAVE
// ========================================================

function copiar(chave){

    if(!chave){

        alert(
            "Chave não encontrada."
        );

        return;

    }


    navigator.clipboard
        .writeText(chave)
        .then(()=>{

            alert(
                "Chave copiada."
            );

        })
        .catch(()=>{

            alert(
                "Não foi possível copiar automaticamente."
            );

        });

}



// ========================================================
// PESQUISA
// ========================================================

function filtrar(){

    const filtro =
        document
            .getElementById(
                "pesquisa"
            )
            .value
            .toUpperCase();


    const linhas =
        document.querySelectorAll(
            "#listaLicencas tr"
        );


    linhas.forEach(function(linha){

        if(
            linha.innerText
                .toUpperCase()
                .indexOf(filtro) > -1
        ){

            linha.style.display="";

        }
        else{

            linha.style.display="none";

        }

    });

}



// ========================================================
// INICIALIZAÇÃO
// ========================================================

window.onload = async function(){

    await carregarClientes();

    await carregarLicencas();

};

</script>

</body>

</html>
